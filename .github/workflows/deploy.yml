name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Deploys into a NEW folder matching upstream's rename (module
          # computes its route from basename(__DIR__)) - the app now sends
          # _api4webtrees_ to match. The old modules_v4/webtreesand-api/
          # folder is left on the server; delete it manually once this new
          # module is confirmed working (see deploy notes).
          server-dir: ./modules_v4/api4webtrees/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**

      # FTP-Deploy-Action can leave a partial upload on the server without
      # failing the job (or fail after only some files transferred, e.g. a
      # dropped connection) - this compares local vs. remote file counts so
      # an incomplete deploy is caught here instead of surfacing later as a
      # broken module in production.
      - name: Verify deploy completeness
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          find . -type f -not -path './.git/*' -not -name '.git*' -not -path './.github/*' | sed 's|^\./||' | sort > local.txt
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_HOST }}" -e "find modules_v4/api4webtrees; bye" \
            | grep -v '/$' | grep -v '^$' | sed 's|^modules_v4/api4webtrees/||' | sort > remote.txt
          echo "Local files: $(grep -cv '^local.txt$' local.txt)  Remote files: $(wc -l < remote.txt)"
          # Lists both ways: missing on the server = incomplete upload; only on the server = left from an older
          # deploy (or the FTP action's sync state) - to look at and delete by hand.
          MISSING=$(comm -23 local.txt remote.txt | grep -v '^local.txt$' || true)
          EXTRA=$(comm -13 local.txt remote.txt || true)
          [ -n "$MISSING" ] && { echo "Missing on the server:"; echo "$MISSING"; }
          [ -n "$EXTRA" ] && { echo "Only on the server:"; echo "$EXTRA"; }
          if [ -n "$MISSING" ] || [ -n "$EXTRA" ]; then
            echo "::error::Files differ after deploy - see the lists above."
            exit 1
          fi
